services:
  mysql_db:
    image: mysql:8.0
    container_name: clinic_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-identity:
    build:
      context: ./backend/clinic-identity
      dockerfile: Dockerfile
    container_name: clinic-identity
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_identity?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-profile:
    build:
      context: ./backend/clinic_profile
      dockerfile: Dockerfile
    container_name: clinic-profile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_profile?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-appointment:
    build:
      context: ./backend/clinic_appointment
      dockerfile: Dockerfile
    container_name: clinic-appointment
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_appointment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-medical-record:
    build:
      context: ./backend/clinic_medical_record
      dockerfile: Dockerfile
    container_name: clinic-medical-record
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_medical_record?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SERVICES_IDENTITY_URL=http://clinic-identity:8081
      - SERVICES_APPOINTMENT_URL=http://clinic-appointment:8083
      - SERVICES_NOTIFICATION_URL=http://clinic-notification:8086
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-payment:
    build:
      context: ./backend/clinic_payment
      dockerfile: Dockerfile
    container_name: clinic-payment
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_payment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SERVICES_NOTIFICATION_URL=http://clinic-notification:8086
      - SERVICES_APPOINTMENT_URL=http://clinic-appointment:8083
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  clinic-notification:
    build:
      context: ./backend/clinic_notification
      dockerfile: Dockerfile
    container_name: clinic-notification
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://clinic_mysql:3306/clinic_notification?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      mysql_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  api-gateway:
    build:
      context: ./backend/api_gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - CLINIC_IDENTITY_URI=http://clinic-identity:8081
      - CLINIC_PROFILE_URI=http://clinic-profile:8082
      - CLINIC_APPOINTMENT_URI=http://clinic-appointment:8083
      - CLINIC_MEDICAL_RECORD_URI=http://clinic-medical-record:8084
      - CLINIC_PAYMENT_URI=http://clinic-payment:8085
      - CLINIC_NOTIFICATION_URI=http://clinic-notification:8086
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75.0
    depends_on:
      - clinic-identity
      - clinic-profile
      - clinic-appointment
      - clinic-medical-record
      - clinic-payment
      - clinic-notification
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  mysql_data:
